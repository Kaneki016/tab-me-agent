<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tabme</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="wordmark">Tabme</p>
      <p class="lede">One-click tab triage & workspace actions.</p>
    </header>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button id="groupAndOpenBtn" type="button" class="btn-primary" style="padding: 10px 14px; font-weight: 600;">
        Group Tabs & Open Tabme
      </button>
      <button id="openDashboardBtn" type="button" style="background: transparent; color: var(--ink); border: 1px solid var(--ink);">
        Open Dashboard
      </button>
      <button id="openPanelBtn" type="button" style="background: transparent; color: var(--ink-soft); border: 1px dashed var(--line); font-size: 0.85rem;">
        Open Side Panel
      </button>
    </div>
    <p id="status" role="status"></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
