<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tabme</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="wordmark">Tabme</p>
      <p class="lede">Human-in-the-loop tab triage.</p>
    </header>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button id="openPanelBtn" type="button">Open Side Panel</button>
      <button id="captureBtn" type="button" style="background: transparent; color: var(--ink); border: 1px solid var(--ink);">
        Quick capture
      </button>
    </div>
    <p id="status" role="status"></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
